name: Build and test x64
on:
  push:
    branches: [main, feature/arm64]
  pull_request:
    branches: [main]
jobs:
  build-x64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout AltDSS-Rust
        uses: actions/checkout@v3
        
      - name: Build and test x64
        run: ./scripts/build_multiarch.sh