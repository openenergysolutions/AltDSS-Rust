name: Build and test ARM64
on:
  push:
    branches: [main, feature/arm64]
  pull_request:
    branches: [main]

jobs:
  build-arm64:
    # Use native ARM64 runner if available, otherwise use QEMU emulation
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout AltDSS-Rust
        uses: actions/checkout@v3
        
      - name: Test ARM64 dss_capi availability
        run: |
          echo "Testing if ARM64 dss_capi binaries are available..."
          curl -I "https://github.com/dss-extensions/dss_capi/releases/download/0.14.3/dss_capi_0.14.3_linux_arm64.tar.gz"
        
      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build ARM64 project in container
        run: |
          # Create optimized Dockerfile for ARM64 build
          cat > Dockerfile.arm64 << 'EOF'
          FROM arm64v8/ubuntu:22.04
          
          # Set non-interactive mode for apt
          ENV DEBIAN_FRONTEND=noninteractive
          
          # Install dependencies in one layer to reduce size
          RUN apt-get update && apt-get install -y \
              curl \
              wget \
              build-essential \
              clang \
              libclang-dev \
              cmake \
              libprotobuf-dev \
              protobuf-compiler \
              libsuitesparse-dev \
              libeigen3-dev \
              git \
              jq \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/* \
              && apt-get clean
          
          # Install Rust
          RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          ENV PATH="/root/.cargo/bin:${PATH}"
          
          # Verify Rust installation
          RUN rustc --version && cargo --version
          
          # Set working directory
          WORKDIR /workspace
          
          # Copy source code
          COPY . .
          
          # Make scripts executable
          RUN chmod +x scripts/*.sh
          
          # Set explicit target architecture for build
          ENV CARGO_CFG_TARGET_ARCH=aarch64
          
          # Run build with verbose output and better error handling
          RUN echo "=== Starting ARM64 build ===" && \
              echo "Architecture: $(uname -m)" && \
              echo "Rust target: $(rustc --version --verbose | grep 'host:')" && \
              ./scripts/build_multiarch.sh
          EOF
          
          # Build the ARM64 container with platform specification
          docker buildx build \
            --platform linux/arm64 \
            --progress=plain \
            --no-cache \
            -f Dockerfile.arm64 \
            .